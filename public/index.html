<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ponto do Cafe - Cadastro de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ponto do Cafe</h1>
    <p>Sistema de Gerenciamento de Clientes</p>
  </header>

  <main>
    <section class="card">
      <h2>Cadastrar Cliente</h2>
      <form id="form-cadastro">
        <input type="text" id="nome" placeholder="Nome completo" required>
        <input type="text" id="telefone" placeholder="Telefone" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <button type="submit">Cadastrar</button>
      </form>
      <p id="mensagem" class="msg"></p>
    </section>

    <section class="card">
      <h2>Clientes Cadastrados</h2>
      <button id="btn-listar">Consultar Clientes</button>
      <table id="tabela">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Acao</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
